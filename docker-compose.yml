version: '3.8'

services:
  # ── AI Model Server ──
  ai-server:
    build: ./ai_server
    container_name: clf-ai-server
    ports:
      - "8000:8000"
    volumes:
      - ai_model_cache:/app/model_cache
    env_file:
      - ./ai_server/.env
    environment:
      MODEL_CACHE: /app/model_cache
    restart: unless-stopped
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ai_model_cache:
